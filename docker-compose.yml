services:
  monitor:
    # Built and pushed to GHCR by GitHub Actions (.github/workflows/build.yml).
    # Compose only pulls; there is deliberately no build: block.
    image: ${APP_IMAGE:-ghcr.io/ki4hrg/ynab-balance-monitor:main}
    pull_policy: always
    env_file: .env
    restart: unless-stopped
    # Heartbeat written by the scheduling loop (scheduled mode only).
    # In run-once mode the process exits after one run and this check does not apply.
    healthcheck:
      test: ["CMD-SHELL", "find /tmp/heartbeat -mmin -10 | grep -q ."]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
